server {
    listen 443 ssl http2;
    server_name moss.lucianmarin.com;
    access_log /home/lucian/logs/moss.log.gz combined gzip;
    ssl_certificate /etc/letsencrypt/live/moss.lucianmarin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moss.lucianmarin.com/privkey.pem;
    location /assets {
        root /home/lucian/moss/dist;
        expires 365d;
        autoindex off;
    }
    location /static {
        root /home/lucian/moss/dist;
        expires 365d;
        autoindex off;
    }
    location /.well-known/acme-challenge {
        root /home/lucian;
    }
    location / {
        root /home/lucian/moss/dist;
        index index.html;
    }
}

server {
    listen 80;
    server_name moss.lucianmarin.com;
    return 301 https://moss.lucianmarin.com$request_uri;
}

